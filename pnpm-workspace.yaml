packages:
  - "apps/*"
  - "packages/*"
  - "tests"

# pnpm blocks dependency lifecycle scripts by default. Anything that needs a
# postinstall to fetch a native binary or generate code must be allowed here.
#
# The key is `allowBuilds` (a map), NOT `onlyBuiltDependencies` (a list).
# pnpm 11 still *reads* the old key — `pnpm config get onlyBuiltDependencies`
# returns it — but no longer acts on it, so an allowlist written the old way is
# a silent no-op. Verified 2026-08-16: with only the list present, `pnpm install`
# ended in `ERR_PNPM_IGNORED_BUILDS` naming these four, and pnpm rewrote this
# file with a stub `allowBuilds` block asking to be filled in.
#
# Nothing here actually breaks when the scripts are skipped — every native
# binding in this stack ships as a prebuilt platform package
# (`@swc/core-linux-x64-gnu`, `@tailwindcss/oxide-linux-x64-gnu`) rather than
# being compiled on install, and Prisma's engines ship inside `@prisma/engines`.
# The allowlist is here so that stays true by intent rather than by luck.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  "@tailwindcss/oxide": true
  "@swc/core": true

# Not listed, because they are not in the tree:
#   esbuild        — Vite 8 bundles with rolldown, not esbuild
#   unrs-resolver  — not a dependency of anything here
# Re-add them if either ever appears.

# Fail the install when the running Node does not satisfy `engines.node`,
# rather than printing a warning nobody reads.
#
# This lives here and NOT in `.npmrc`, for the same reason `allowBuilds` does:
# pnpm 11 reads its settings from this file. `.npmrc` still carries
# `engine-strict=true` from npm-era habit and pnpm 11 ignores it completely —
# `pnpm config get engine-strict` returned `undefined` with only that line
# present, and an install on Node 26 against an `engines` of `24.x` printed
# `[WARN] Unsupported engine` and **exited 0**. Verified 2026-08-18, the second
# silent no-op found in this file's neighbourhood.
engineStrict: true
