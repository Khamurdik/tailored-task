# The local database, and the one the integration suite uses.
#
# One compose file rather than `testcontainers`: that would be a dependency and
# a Docker-API integration for something six lines do, and rather than a Neon
# branch, which needs credentials in CI and network on every run. This doubles
# as the local dev database, so there is one Postgres to know about.
#
# Started by `tests/src/support/global-setup.ts` if it is not already running.
services:
  postgres:
    image: postgres:18-alpine
    container_name: dataroom-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dataroom
    ports:
      # 5433 on the host, not 5432. A developer machine running this project is
      # very likely already running a Postgres, and a port clash here surfaces
      # as authentication errors against the wrong database rather than as a
      # failure to start.
      - '5433:5432'
    healthcheck:
      # `pg_isready` alone returns true while the server is still starting up
      # its first-run initialisation, so the suite would connect and then fail.
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dataroom']
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      # The test database is disposable by design — a fresh one per run beats
      # cleaning between tests. Keeping it in tmpfs makes that cheap and means
      # nothing survives a reboot to be stale later.
      #
      # `/var/lib/postgresql`, NOT `/var/lib/postgresql/data`. Postgres 18
      # changed the convention: the data now lives in a subdirectory of the
      # mount so `pg_upgrade --link` does not have to cross a mount boundary.
      # Mounting the old path makes the entrypoint find an "unused
      # mount/volume", refuse to initialise, and exit 1 — which reads as a
      # corrupt-data warning rather than as a misconfigured mount.
      - /var/lib/postgresql

  # ---------------------------------------------------------------------------
  # An S3-compatible bucket, so the upload path can be exercised locally and by
  # the journeys.
  #
  # Added because `storage` had only ever run against its in-memory twin: the
  # presigned PUT, the `HeadObject` at `/complete`, the magic-byte range read and
  # the `Content-Disposition` on download are the four things that cannot be
  # proven without a real bucket, and three of them are security-relevant.
  #
  # MinIO rather than localstack: it is the S3 API and nothing else, which is all
  # this needs, and it starts in about a second.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: dataroom-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dataroom
      MINIO_ROOT_PASSWORD: dataroom-secret
      # The browser PUTs directly to this host from the app's origin, so the
      # bucket has to allow it. Without this every upload fails at the preflight
      # with an error that names no cause.
      MINIO_API_CORS_ALLOW_ORIGIN: '*'
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data

  # Creates the bucket and exits. A one-shot container rather than a shell step
  # in the harness, so `docker compose up` is the whole setup.
  minio-init:
    image: minio/minio:latest
    container_name: dataroom-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 dataroom dataroom-secret &&
      mc mb --ignore-existing local/dataroom &&
      echo 'bucket ready'
      "
